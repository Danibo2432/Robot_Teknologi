# Per-joint limits use radians, radians/second and radians/second^2.
# Change max_velocity for an individual joint; global scales are in drawing_limits.yaml.
# Defaults match the UR5e description's 180 deg/s cap (3.14159 rad/s).
joint_limits:
  shoulder_pan_joint: {has_velocity_limits: true, max_velocity: 3.14159, has_acceleration_limits: true, max_acceleration: 1.0}
  shoulder_lift_joint: {has_velocity_limits: true, max_velocity: 3.14159, has_acceleration_limits: true, max_acceleration: 1.0}
  elbow_joint: {has_velocity_limits: true, max_velocity: 3.14159, has_acceleration_limits: true, max_acceleration: 1.0}
  wrist_1_joint: {has_velocity_limits: true, max_velocity: 3.14159, has_acceleration_limits: true, max_acceleration: 1.5}
  wrist_2_joint: {has_velocity_limits: true, max_velocity: 3.14159, has_acceleration_limits: true, max_acceleration: 1.5}
  wrist_3_joint: {has_velocity_limits: true, max_velocity: 3.14159, has_acceleration_limits: true, max_acceleration: 1.5}
